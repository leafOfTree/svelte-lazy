name: Node.js CI

on:
  push:
    branches: ['master', '1.x']
  pull_request:
    branches: ['master', '1.x']

jobs:
  test:
    name: Lint and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22.x
          cache: 'npm'
      - run: npm ci
      - run: npm run lint
      - run: npm run check
      # Uses the Chrome installed on the runner
      - run: npm test
      - run: npm run build:demo

  compile:
    name: Compile with Svelte ${{ matrix.svelte }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The oldest Svelte in peerDependencies. The latest is tested above
        svelte: ['5.0.0']
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22.x
          cache: 'npm'
      - run: npm ci
      # Package by the latest Svelte, as when publishing
      - run: npm run package
      - run: npm i --no-save svelte@${{ matrix.svelte }}
      - run: npm run check:svelte
