name: Node.js CI

on:
  push:
    branches: ['master']
  pull_request:
    branches: ['master']

jobs:
  test:
    name: Lint and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22.x
          cache: 'npm'
      - run: npm ci
      - run: npm run lint
      - run: npm run check
      # Uses the Chrome installed on the runner
      - run: npm test
      - run: npm run build:demo

  compile:
    name: Compile with Svelte ${{ matrix.svelte }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        svelte: [3, 4, 5]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22.x
          cache: 'npm'
      - run: npm ci
      - run: npm i --no-save svelte@${{ matrix.svelte }}
      - run: npm run check:svelte
