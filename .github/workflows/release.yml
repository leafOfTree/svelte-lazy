# Publish to npm when a version tag like v1.4.0 is pushed, by npm trusted
# publishing: no npm token is stored, and npm adds provenance
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24.x
          registry-url: 'https://registry.npmjs.org'
          # No cache in release builds, as npm recommends
          package-manager-cache: false
      # Trusted publishing needs npm 11.5.1 or later
      - run: npm install -g npm@^11.5.1
      - name: Check the tag matches the version in package.json
        run: test "${GITHUB_REF_NAME}" = "v$(node -p "require('./package.json').version")"
      - run: npm ci
      - run: npm run lint
      - run: npm run check
      - run: npm test
      # Prereleases like 2.0.0-next.0 go to the next tag, and fixes of an
      # older major version, like 1.5.1 after 2.0, to latest-1, so latest
      # stays the newest version
      - name: Publish
        run: |
          version=$(node -p "require('./package.json').version")
          latest=$(npm view svelte-lazy version)
          if [[ "$version" == *-* ]]; then
            tag=next
          elif [ "${version%%.*}" -lt "${latest%%.*}" ]; then
            tag="latest-${version%%.*}"
          else
            tag=latest
          fi
          echo "Publishing $version with the $tag tag"
          npm publish --tag "$tag"
